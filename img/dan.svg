<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="100%" height="100%" style="background: transparent;">
  <defs>
    <!-- Gradient Nâu Đậm -->
    <linearGradient id="darkBrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5C3A21" />
      <stop offset="100%" stop-color="#301A0E" />
    </linearGradient>

    <!-- Gradient Nâu Sáng -->
    <linearGradient id="lightBrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A373" />
      <stop offset="100%" stop-color="#A97142" />
    </linearGradient>

    <!-- Gradient Phối Hợp Nâu Sáng -> Đậm -->
    <linearGradient id="woodCombo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A373" />
      <stop offset="40%" stop-color="#A97142" />
      <stop offset="100%" stop-color="#301A0E" />
    </linearGradient>
  </defs>

  <g id="harp-frame">
    <!-- 1. THÙNG ĐÀN (SOUNDBOX) -->
    <polygon points="410,230 225,560 210,545 375,200" fill="url(#darkBrown)" />
    <polygon points="375,200 210,545 190,520 340,185" fill="url(#lightBrown)" />

    <!-- 2. CỘT ĐÀN CONG (FOREPILLAR) -->
    <path d="M 140,165 
             C 100,240 105,370 190,520
             C 210,540 220,535 200,500
             C 135,370 135,260 170,185 
             Z" fill="url(#woodCombo)" />

    <!-- 3. CẦN ĐÀN (HARMONIC NECK) -->
    <path d="M 340,185 
             C 410,130 350,100 290,115
             C 230,130 180,140 140,165
             C 170,185 220,170 270,150
             C 320,130 375,170 410,230
             Z" fill="url(#woodCombo)" />

    <!-- 4. ĐẦU CUỘN ỐC XOẮN (SCROLL) -->
    <g fill="url(#lightBrown)">
      <path d="M 140,165 
               C 120,140 115,90 150,50 
               C 190,10 240,40 230,80
               C 220,120 180,110 170,85
               C 160,60 190,50 200,65
               C 210,80 185,95 175,80
               C 170,72 180,68 185,72
               C 170,50 130,90 150,130
               Z" />
    </g>

    <!-- Hàng chốt cắm dây nhỏ -->
    <g fill="#301A0E" opacity="0.8">
        <circle cx="160" cy="170" r="1.5" /><circle cx="175" cy="165" r="1.5" /><circle cx="190" cy="160" r="1.5" /><circle cx="205" cy="155" r="1.5" /><circle cx="220" cy="150" r="1.5" /><circle cx="235" cy="145" r="1.5" /><circle cx="250" cy="140" r="1.5" /><circle cx="265" cy="135" r="1.5" /><circle cx="280" cy="130" r="1.5" /><circle cx="295" cy="125" r="1.5" /><circle cx="310" cy="120" r="1.5" /><circle cx="325" cy="115" r="1.5" /><circle cx="340" cy="110" r="1.5" />
    </g>

    <!-- Đường vân rãnh gỗ -->
    <path d="M 140,165 C 150,175 160,180 170,185" stroke="#301A0E" stroke-width="2" fill="none" opacity="0.5" />
    <path d="M 340,185 L 410,230" stroke="#301A0E" stroke-width="2" stroke-dasharray="3,3" opacity="0.4" />
  </g>
</svg>